name: Nightly backup

# An encrypted dump of the public schema, uploaded to private storage (Backblaze
# B2, S3-compatible) every night. The repository is public: the dump is never an artifact, the
# log shows no data, and the secrets live in the `backup` environment, which is
# limited to the main branch (Settings > Environments). Setup and the restore
# drill are in docs/runbook.md ("Backups"). A red run means last night has no
# backup: GitHub emails the people watching the repository.

on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: backup
    steps:
      - uses: actions/checkout@v7
      # Supabase runs Postgres 17: pg_dump must be at least that new, and the
      # runner ships an older one. PGDG's own repository, no third-party action.
      - name: Install pg_dump 17 and age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Dump, encrypt, upload
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          scripts/backup/backup.sh
