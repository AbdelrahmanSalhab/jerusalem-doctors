name: Production smoke

# Read-only checks against the live site: after every production deploy,
# every six hours, and on demand. Signs in as the CI account with a token
# GitHub issues to this workflow (id-token: write, /api/login/ci): there is
# no password. Its requests carry this run's URL (x-ci-run), so the activity
# log shows "اختبار آلي (CI)" and its searches are not counted in the stats.
# A failure here means the live site needs a look.
#
# Needs CI_LOGIN_EMAIL on Vercel (scripts/add-ci-account.ts). No secrets.

on:
  deployment_status:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    # Deploy events fire for previews and for every state; only a finished
    # production deploy is worth checking.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    # id-token: GitHub's short-lived token for the sign-in (/api/login/ci).
    permissions:
      contents: read
      id-token: write
      issues: write
    # Pinned to the current LTS on purpose: a moving label (ubuntu-latest)
    # can change the browser system libraries without a commit.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke checks
        run: npx playwright test -c playwright.smoke.config.ts
        env:
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Lighthouse on the signed-in dashboard (e2e/smoke/lighthouse.spec.ts),
          # warn-only, scores to the job summary; not on the six-hourly runs.
          SMOKE_LIGHTHOUSE: ${{ github.event_name != 'schedule' && '1' || '' }}
      - name: Lighthouse (public pages)
        if: github.event_name != 'schedule'
        run: npx -y @lhci/cli@0.15.1 autorun
      # Only the Lighthouse reports of the public pages. Never e2e/.results as a
      # whole: it holds the signed-in session, and the repository is public.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: smoke-lighthouse
          path: e2e/.results/lighthouse
          retention-days: 14
          # The folders start with a dot, which upload-artifact skips by default.
          include-hidden-files: true
      # A red run nobody sees is the failure mode of a job that runs on its own:
      # open (or add to) one issue, so it shows in the repository's notifications.
      - name: Open an issue for the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Production smoke checks are failing"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then gh issue comment "$open" --body "Failed again: $RUN_URL"
          else gh issue create --title "$title" --body "The read-only checks against the live site failed. Run: $RUN_URL"; fi
