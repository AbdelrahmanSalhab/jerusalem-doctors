name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned to the current LTS on purpose: a moving label (ubuntu-latest)
    # can change the browser system libraries without a commit.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Integration and browser tests: the repo's migrations on a fresh local
  # Supabase, a real Redis for rate limits, the production build, and
  # Playwright (database security, the API permission table, user journeys
  # on desktop Chrome and iPhone WebKit). See e2e/README.md.
  #
  # Three legs, each with its own Supabase and Redis, so they share no data
  # and no CPU: the iPhone (WebKit) tests would otherwise have to wait for
  # every desktop test, because both change the same database (fixed phone
  # numbers and licences, global event counts, listings), and the page sweep
  # beside the desktop tests slowed them by half. The first leg keeps the name
  # `e2e`. Only it saves caches and checks the database types, once.
  e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: e2e
            slug: main
            projects: --project=db --project=api --project=desktop
            first: true
          - name: e2e (phone)
            slug: phone
            projects: --project=phone --no-deps
            first: false
          - name: e2e (sweep)
            slug: sweep
            projects: --project=sweep --no-deps
            first: false
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      # The Docker images (Supabase's and Redis's) come from our own Actions
      # cache, not the registries: a registry's pull limit once failed a run
      # before any test started. The key changes daily, so images are
      # refreshed once a day; a miss falls back to the newest earlier copy
      # and only what it lacks is downloaded. Only main saves it (a PR reads
      # main's), so branches do not fill the repository's cache quota.
      - name: Today's image cache key
        id: images
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore Docker images
        id: images-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/images
          key: docker-images-v2-supabase-2.121.0-${{ steps.images.outputs.day }}
          restore-keys: docker-images-v2-supabase-2.121.0-
      # Supabase spends most of its minute getting images, so it starts first
      # and in the background while npm, the browsers and the build run.
      - name: Start Supabase in the background (every migration from zero)
        run: |
          # Each phase's seconds go to supabase.phases (printed below), to see
          # which part of the start is the long one.
          (t=$(date +%s); mark() { echo "- $1: $(( $(date +%s) - t )) s" >> "$RUNNER_TEMP/supabase.phases"; t=$(date +%s); }
            if [ -d "$RUNNER_TEMP/images" ]; then ls "$RUNNER_TEMP"/images/*.tar | xargs -P 4 -n 1 docker load -q -i; fi && mark "docker load" \
            && supabase start -x studio,realtime,edge-runtime,logflare,vector,imgproxy,mailpit,postgres-meta,supavisor && mark "supabase start" \
            && supabase seed buckets && mark "seed buckets"; echo $? > "$RUNNER_TEMP/supabase.exit") > "$RUNNER_TEMP/supabase.log" 2>&1 &
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The runner's ImageOS (ubuntu24, ubuntu26, ...): browser builds are per
      # OS release. It is a shell variable, not in the `env` context, which
      # left it out of the key.
      - name: OS release
        id: os
        run: echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.os.outputs.image }}-${{ hashFiles('package-lock.json') }}
      # --with-deps installs WebKit's libraries with apt every run (the image
      # lacks some). The runner's default mirror, azure.archive.ubuntu.com,
      # sometimes trickles at ~60 kB/s, which no apt timeout catches, and the
      # install took 7 to 20 minutes (actions/runner-images#14823). The
      # canonical archive instead.
      - name: Install browsers in the background
        run: |
          sudo find /etc/apt \( -name sources.list -o -name '*.sources' -o -name apt-mirrors.txt \) \
            -exec sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' {} +
          grep -rhoE "https?://[a-z.]*archive\.ubuntu\.com" /etc/apt/ | sort | uniq -c || true
          (npx playwright install --with-deps chromium webkit; echo $? > "$RUNNER_TEMP/browsers.exit") > "$RUNNER_TEMP/browsers.log" 2>&1 &
      - name: Build the app against the test stack
        run: |
          # e2e/env.ts is the one list of the test stack's settings.
          node --experimental-strip-types -e 'import("./e2e/env.ts").then((m) => { for (const [k, v] of Object.entries(m.appEnv())) console.log(`${k}=${v}`) })' >> "$GITHUB_ENV"
      # Next's own build cache: a build with it takes a third of the time.
      # Restored by every run; only main saves it, once a day (as the Docker
      # images above), so branches do not fill the repository's cache quota.
      - name: Restore Next's build cache
        id: next-cache
        uses: actions/cache/restore@v6
        with:
          path: .next/cache
          key: next-cache-${{ hashFiles('package-lock.json') }}-${{ steps.images.outputs.day }}
          restore-keys: next-cache-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - uses: actions/cache/save@v6
        if: matrix.first && github.event_name == 'push' && steps.next-cache.outputs.cache-hit != 'true'
        with:
          path: .next/cache
          key: next-cache-${{ hashFiles('package-lock.json') }}-${{ steps.images.outputs.day }}
      - name: Start Redis for rate limits
        run: docker compose -f e2e/docker-compose.yml -p jd-e2e up -d --wait
      # Ten minutes at most: a stalled install (apt under --with-deps) once
      # hung the job silently until it timed out. This prints its log instead.
      - name: Wait for Supabase and the browsers
        run: |
          for job in supabase browsers; do
            until [ -f "$RUNNER_TEMP/$job.exit" ]; do
              if [ $SECONDS -gt 600 ]; then echo "$job still running after 10 minutes:"; cat "$RUNNER_TEMP/$job.log"; exit 1; fi
              sleep 2
            done
            code=$(cat "$RUNNER_TEMP/$job.exit")
            if [ "$code" != "0" ]; then echo "$job failed ($code):"; cat "$RUNNER_TEMP/$job.log"; exit 1; fi
            # apt's "Fetched … in …s (… kB/s)" shows the mirror's speed.
            grep -h "^Fetched" "$RUNNER_TEMP/$job.log" || true
            tail -3 "$RUNNER_TEMP/$job.log"
          done
          { echo "### Supabase start (${{ matrix.name }})"; cat "$RUNNER_TEMP/supabase.phases"; } | tee -a "$GITHUB_STEP_SUMMARY"
      # The app's database types must match the schema the migrations build.
      # A difference means a migration landed without `npm run db:types`.
      - name: Database types match the migrations
        if: matrix.first
        run: |
          supabase gen types typescript --local > lib/db/database.types.ts
          git diff --exit-code -- lib/db/database.types.ts \
            || { echo "::error file=lib/db/database.types.ts::Stale: with the local stack up, run npm run db:types and commit the result."; exit 1; }
      # One file per image, only the ones the stack runs, so the next run can
      # load them side by side: one `docker load` of everything took 60 to 70 s
      # next to npm ci, the longest part of the setup.
      - name: Save today's Docker images
        if: matrix.first && (github.event_name == 'push' || github.event_name == 'pull_request') && steps.images-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/images"
          docker ps --format '{{.Image}}' | sort -u | while read -r image; do
            docker save -o "$RUNNER_TEMP/images/$(echo "$image" | tr '/:' '__').tar" "$image"
          done
          ls -la "$RUNNER_TEMP/images" 
      - uses: actions/cache/save@v6
        if: matrix.first && (github.event_name == 'push' || github.event_name == 'pull_request') && steps.images-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/images
          key: docker-images-v2-supabase-2.121.0-${{ steps.images.outputs.day }}
      - run: npx playwright test ${{ matrix.projects }}
        env:
          E2E_PREBUILT: "1"
      # Where the minutes went: per project, and the slowest tests.
      - name: Timing summary
        if: always()
        run: node scripts/e2e-timing.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.slug }}
          path: |
            e2e/.report
            e2e/.results
          retention-days: 14
          # The folders start with a dot, which upload-artifact skips by default.
          include-hidden-files: true
