name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned to the current LTS on purpose: a moving label (ubuntu-latest)
    # can change the browser system libraries without a commit.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Integration and browser tests: the repo's migrations on a fresh local
  # Supabase, a real Redis for rate limits, the production build, and
  # Playwright (database security, the API permission table, user journeys
  # on desktop Chrome and iPhone WebKit). See e2e/README.md.
  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      # The Docker images (Supabase's and Redis's) come from our own Actions
      # cache, not the registries: a registry's pull limit once failed a run
      # before any test started. The key changes daily, so images are
      # refreshed once a day; a miss falls back to the newest earlier copy
      # and only what it lacks is downloaded. Only main saves it (a PR reads
      # main's), so branches do not fill the repository's cache quota.
      - name: Today's image cache key
        id: images
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore Docker images
        id: images-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/images.tar
          key: docker-images-supabase-2.121.0-${{ steps.images.outputs.day }}
          restore-keys: docker-images-supabase-2.121.0-
      # Supabase spends most of its minute getting images, so it starts first
      # and in the background while npm, the browsers and the build run.
      - name: Start Supabase in the background (every migration from zero)
        run: |
          (if [ -f "$RUNNER_TEMP/images.tar" ]; then docker load -q -i "$RUNNER_TEMP/images.tar"; fi \
            && supabase start -x studio,realtime,edge-runtime,logflare,vector,imgproxy,mailpit,postgres-meta,supavisor \
            && supabase seed buckets; echo $? > "$RUNNER_TEMP/supabase.exit") > "$RUNNER_TEMP/supabase.log" 2>&1 &
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # ImageOS (ubuntu24, ubuntu26, ...): browser builds are per OS release.
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('package-lock.json') }}
      - name: Install browsers in the background
        run: |
          (npx playwright install --with-deps chromium webkit; echo $? > "$RUNNER_TEMP/browsers.exit") > "$RUNNER_TEMP/browsers.log" 2>&1 &
      - name: Build the app against the test stack
        run: |
          # e2e/env.ts is the one list of the test stack's settings.
          node --experimental-strip-types -e 'import("./e2e/env.ts").then((m) => { for (const [k, v] of Object.entries(m.appEnv())) console.log(`${k}=${v}`) })' >> "$GITHUB_ENV"
      - run: npm run build
      - name: Start Redis for rate limits
        run: docker compose -f e2e/docker-compose.yml -p jd-e2e up -d --wait
      # Ten minutes at most: a stalled install (apt under --with-deps) once
      # hung the job silently until it timed out. This prints its log instead.
      - name: Wait for Supabase and the browsers
        run: |
          for job in supabase browsers; do
            until [ -f "$RUNNER_TEMP/$job.exit" ]; do
              if [ $SECONDS -gt 600 ]; then echo "$job still running after 10 minutes:"; cat "$RUNNER_TEMP/$job.log"; exit 1; fi
              sleep 2
            done
            code=$(cat "$RUNNER_TEMP/$job.exit")
            if [ "$code" != "0" ]; then echo "$job failed ($code):"; cat "$RUNNER_TEMP/$job.log"; exit 1; fi
            tail -3 "$RUNNER_TEMP/$job.log"
          done
      - name: Save today's Docker images
        if: github.event_name == 'push' && steps.images-cache.outputs.cache-hit != 'true'
        run: docker save -o "$RUNNER_TEMP/images.tar" $(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -v '<none>')
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && steps.images-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/images.tar
          key: docker-images-supabase-2.121.0-${{ steps.images.outputs.day }}
      - run: npx playwright test
        env:
          E2E_PREBUILT: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 14
          # The folders start with a dot, which upload-artifact skips by default.
          include-hidden-files: true
