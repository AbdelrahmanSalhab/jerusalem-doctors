# Weekly update PRs for npm packages and GitHub Actions, grouped so a week
# brings a handful of PRs rather than one per package. Each runs the usual CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    # Node's types follow the Node we run (22, as on Vercel and in CI), not
    # the newest Node: newer types allow APIs that do not exist at runtime.
    # Raise this together with the Node version.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # From 2.2 its scripts use an Upstash-only Redis flag
      # (allow-key-locking) that the plain Redis behind CI's e2e rejects, so
      # every sign-in in the tests fails (#133). Patches only, until the test
      # stack can run them.
      - dependency-name: "@upstash/ratelimit"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # ESLint 10 and TypeScript 7 wait for the lint tooling: eslint-config-next's
      # react, import and jsx-a11y plugins declare ESLint 9 at most, and
      # typescript-eslint refuses TypeScript 7.0 until 7.1's API (#138, #137,
      # and the tracking issue).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      types:
        patterns: ["@types/*"]
      supabase:
        patterns: ["@supabase/*"]
      sentry:
        patterns: ["@sentry/*"]
      # react and react-dom must be the exact same version, or React refuses
      # to render (#132 bumped react alone).
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      test:
        patterns: ["vitest", "@vitest/*", "@playwright/*", "playwright"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
